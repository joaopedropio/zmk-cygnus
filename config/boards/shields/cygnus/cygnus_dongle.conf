# better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 5 profiles (n+2)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# ZMK Studio: live keymap edits from the desktop app, talking to whichever
# build is the split central - this one. It gets a transport for free: ZMK_BLE
# is already on here, so CONFIG_ZMK_STUDIO_TRANSPORT_BLE defaults to y with
# nothing else set. Add the studio-rpc-usb-uart snippet at build time
# (`-S "cdc-acm-console studio-rpc-usb-uart"`, alongside the shell's) for a
# second, USB-serial transport over the same cable - it opens its own CDC ACM
# endpoint, so it does not take the console's.
CONFIG_ZMK_STUDIO=y

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Turn on logging, and set ZMK logging to debug output
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=n

# Avoid deprecated KSCAN symbol warning
CONFIG_KSCAN=n

# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Cygnus"
CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
# The game draws from static buffers, but the splash and the dashboard take
# their scaled bitmaps from the kernel heap - 12.3K for the two-slot layout and
# about 15K for this one, where the layer widget gets the big scale-9 font.  8K
# was enough while the maze was all there was; it is not now, and a widget that
# gets nothing back from k_malloc() simply does not draw.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

# Enable Backlight Control
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# configure the pacman game
# Panel rotation: 0, 90, 180 or 270
CONFIG_PACMAN_ROTATE_DISPLAY=0
# Milliseconds per frame (33 is about 30 fps)
CONFIG_PACMAN_FRAME_INTERVAL=33
# Speed the game up while you type
CONFIG_PACMAN_WPM_SPEED=y
CONFIG_PACMAN_WPM_SLOW=20
CONFIG_PACMAN_WPM_FAST=60

# how loud the speaker is, 0 to 100.  100 is unity - one voice at full tilt
# reaches full scale on its own, and a limiter catches what a chord stacks on
# top.  This was 25, which is 12 dB down and most of the way to inaudible on a
# small speaker; 80 leaves the limiter working only on the peaks.
CONFIG_PACMAN_SOUND_VOLUME=80

# which screen comes up after the splash: "game" or "status" (the dashboard).
# Tap the dongle action key to swap between them, hold it to change theme.
CONFIG_PACMAN_DEFAULT_SCREEN="game"
# What the dashboard shows.  5-slot is a full-width band across the top and
# then two rows of two, which is five slots for five widgets - the layer gets
# the band and the big font that comes with it.  (2-slot keeps the animated
# header instead but only has room for two; 6-slot is three rows of two.)
CONFIG_PACMAN_INFO_SLOT_MODE="5-slot"
CONFIG_PACMAN_INFO_SLOT_1="empty"
CONFIG_PACMAN_INFO_SLOT_2="layer"
CONFIG_PACMAN_INFO_SLOT_3="wpm"
CONFIG_PACMAN_INFO_SLOT_4="theme"
CONFIG_PACMAN_INFO_SLOT_5="connectivity"
CONFIG_PACMAN_INFO_SLOT_6="modifiers"
# and the batteries along the bottom
CONFIG_PACMAN_BATTERY_SLOTS=2

# colours are plain rrggbb strings
# CONFIG_PACMAN_BG_COLOR="000000"
# CONFIG_PACMAN_WALL_COLOR="2121de"
# CONFIG_PACMAN_PACMAN_COLOR="ffee00"

# The `pacman` shell command, which is what the configurator page talks to and
# where profiles live.  It needs somewhere to speak: build with
# `-S cdc-acm-console`, which puts the console on the USB the dongle is already
# plugged into.
#
# That snippet also renames the USB device to "Zephyr USB console sample" and
# takes product id 0x0004, and it cannot be answered from here: snippet config
# is merged after this file, so it wins.  The name and the id go on the build
# command instead, where nothing is merged on top of them:
#
#   -DCONFIG_USB_DEVICE_PRODUCT='"Cygnus"' -DCONFIG_USB_DEVICE_PID=0x615E
CONFIG_SHELL=y
