# better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 5 profiles (n+2)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Turn on logging, and set ZMK logging to debug output
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=n

# Avoid deprecated KSCAN symbol warning
CONFIG_KSCAN=n

# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Cygnus"
CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
# The game draws from static buffers, but the splash and the dashboard take
# their scaled bitmaps from the kernel heap - about 20K for the default
# two-slot layout, more if a slot is given one of the big scale-9 fonts.  8K
# was enough while the maze was all there was; it is not now, and a widget
# that gets nothing back from k_malloc() simply does not draw.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

# Enable Backlight Control
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# configure the pacman game
# Panel rotation: 0, 90, 180 or 270
CONFIG_PACMAN_ROTATE_DISPLAY=0
# Milliseconds per frame (33 is about 30 fps)
CONFIG_PACMAN_FRAME_INTERVAL=33
# Speed the game up while you type
CONFIG_PACMAN_WPM_SPEED=y
CONFIG_PACMAN_WPM_SLOW=20
CONFIG_PACMAN_WPM_FAST=60

# which screen comes up after the splash: "game" or "status" (the dashboard).
# Tap the dongle action key to swap between them, hold it to change theme.
CONFIG_PACMAN_DEFAULT_SCREEN="game"
# what the dashboard shows: 2-slot puts the animated header over two slots,
# 4-, 5- and 6-slot trade it for more of them
# CONFIG_PACMAN_INFO_SLOT_MODE="2-slot"
# CONFIG_PACMAN_INFO_SLOT_5="connectivity"
# CONFIG_PACMAN_INFO_SLOT_6="layer"
# CONFIG_PACMAN_BATTERY_SLOTS=2

