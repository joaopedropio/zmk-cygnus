# better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 5 profiles (n+2)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Turn on logging, and set ZMK logging to debug output
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=n

# Avoid deprecated KSCAN symbol warning
CONFIG_KSCAN=n

# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 增加键盘的 BLE 无线电的发射功率，用解决延迟和左右通讯不佳的问题
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Snake"
CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

# Enable Backlight Control
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# configure snake game
CONFIG_SNAKE_FATNESS=0
# default: 1
CONFIG_SNAKE_BOARD_SIZE="S"
# default: "XL". Options: "XS", "S", "M", "L", "XL", "XXL", "XXXL"
CONFIG_SNAKE_WALK_INTERVAL=20
# default: 20 (in milliseconds)
CONFIG_CHECKERED_BOARD=y
# default: y
CONFIG_WPM_SLOW=20
# default: 20
CONFIG_WPM_MEDIUM=40
# default: 40
CONFIG_WPM_FAST=80
# default: 80
CONFIG_WPM_SUPER_FAST=90
# default: 90

# configure sound
CONFIG_USE_BUZZER=y
# default: n
CONFIG_USE_SPLASH_SOUND=n
# default: n
CONFIG_USE_FOOD_SOUND=n
# default: n
CONFIG_USE_DIE_SOUND=n
# default: n
CONFIG_USE_THEME_SOUND=y
# default: n
CONFIG_USE_MENU_SOUND=y
# default: n
CONFIG_USE_STATUS_SOUND=y
# default: y

# configure other
CONFIG_ROTATE_DISPLAY=0
# default: 0
CONFIG_THEME_THRESHOLD=300
# default: 300 (in milliseconds)
CONFIG_MUTE_THRESHOLD=600
# default: 600 (in milliseconds)
CONFIG_DEFAULT_SCREEN="snake"
# default: "snake". Options: "snake", "status"
CONFIG_LOGO_WALK_INTERVAL=40
# default: 40 (in milliseconds)
CONFIG_SHOW_SINGLE_BATTERY=n
# default: n
CONFIG_INFO_SLOT_MODE="2-slot"
CONFIG_INFO_SLOT_1="battery"
# default: "connectivity". Options: "layer", "connectivity", "theme", "wpm", "modifiers", "empty", "battery"
CONFIG_INFO_SLOT_2="layer"
CONFIG_INFO_SLOT_3="wpm"
CONFIG_INFO_SLOT_4="theme"
CONFIG_INFO_SLOT_5="connectivity"
CONFIG_INFO_SLOT_6="modifiers"

CONFIG_BATTERY_WIDGET_NUMBER=1
# default: 0

# configure theme
CONFIG_USE_COMPLETE_CUSTOM_THEME=y
# default: y
CONFIG_SPLASH_USE_SNAKE_2=n
# default: n
CONFIG_USE_BATTERY_FONT_3X5=n
# default: n

