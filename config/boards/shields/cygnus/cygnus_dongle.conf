# better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 5 profiles (n+2)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Turn on logging, and set ZMK logging to debug output
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG=n

# Avoid deprecated KSCAN symbol warning
CONFIG_KSCAN=n

# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Cygnus"
CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
# snake needed a 64K heap; pacman draws from static buffers and LVGL has its
# own pool (CONFIG_LV_Z_MEM_POOL_SIZE), so this is just a small safety margin.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_INPUT=y
CONFIG_ZMK_EXT_POWER=y

# Enable Backlight Control
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# configure the pacman game
# Panel rotation: 0, 90, 180 or 270
CONFIG_PACMAN_ROTATE_DISPLAY=0
# Milliseconds per frame (33 is about 30 fps)
CONFIG_PACMAN_FRAME_INTERVAL=33
# Speed the game up while you type
CONFIG_PACMAN_WPM_SPEED=y
CONFIG_PACMAN_WPM_SLOW=20
CONFIG_PACMAN_WPM_FAST=60

# colours are plain rrggbb strings
# CONFIG_PACMAN_BG_COLOR="000000"
# CONFIG_PACMAN_WALL_COLOR="2121de"
# CONFIG_PACMAN_PACMAN_COLOR="ffee00"
